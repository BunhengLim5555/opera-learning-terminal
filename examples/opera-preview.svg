<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" font-family="system-ui, sans-serif" role="img" aria-label="LoRA: capacity and placement"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4b5"/></marker></defs><rect width="1000" height="710" fill="#f3f7fa"/><path d="M 190 150 C 190 185, 500 175, 500 210" fill="none" stroke="#91a4b5" stroke-width="2" marker-end="url(#arrow)"/><text x="345" y="175" text-anchor="middle" fill="#40556b" font-size="12">size</text><path d="M 500 150 C 500 185, 500 175, 500 210" fill="none" stroke="#91a4b5" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="175" text-anchor="middle" fill="#40556b" font-size="12">placement</text><path d="M 950 100 H 980 V 420 H 640" fill="none" stroke="#91a4b5" stroke-width="2" marker-end="url(#arrow)"/><text x="972" y="255" text-anchor="end" fill="#40556b" font-size="12">fixed weights</text><path d="M 500 310 C 500 345, 500 335, 500 370" fill="none" stroke="#91a4b5" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="335" text-anchor="middle" fill="#40556b" font-size="12">learned update</text><path d="M 500 470 C 500 505, 500 495, 500 530" fill="none" stroke="#91a4b5" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="495" text-anchor="middle" fill="#40556b" font-size="12">test on held-out data</text><g class="node" data-id="rank" tabindex="0" role="button" aria-label="Rank: capacity per adapter"><rect x="50" y="50" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="77" cy="79" r="13" fill="#fce4cc"/><text x="77" y="84" text-anchor="middle" font-size="12" fill="#a04a18">1</text><text x="100" y="84" font-size="16" fill="#132d42">Rank: capacity per adapter</text><title>Rank r sets the size of the low-rank bottleneck. For a weight matrix with dimensions d_out × d_in, an adapter pair has r(d_in + d_out) trainable parameters. Increasing rank adds capacity and cost; it does not guarantee better validation performance.</title></g><g class="node" data-id="targets" tabindex="0" role="button" aria-label="Targets: where adapters go"><rect x="360" y="50" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="387" cy="79" r="13" fill="#fce4cc"/><text x="387" y="84" text-anchor="middle" font-size="12" fill="#a04a18">2</text><text x="410" y="84" font-size="16" fill="#132d42">Targets: where adapters go</text><title>Target selection decides which weight matrices receive adapters. Adding more target matrices creates more trainable adapter pairs. Rank and placement are separate choices.</title></g><g class="node" data-id="base" tabindex="0" role="button" aria-label="Base weight W stays frozen"><rect x="670" y="50" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="697" cy="79" r="13" fill="#fce4cc"/><text x="697" y="84" text-anchor="middle" font-size="12" fill="#a04a18">3</text><text x="720" y="84" font-size="16" fill="#132d42">Base weight W stays frozen</text><title>In standard LoRA fine-tuning, the chosen base weight is kept fixed. The base model still exists; LoRA reduces trainable adaptation parameters rather than automatically shrinking the base model.</title></g><g class="node" data-id="adapter" tabindex="0" role="button" aria-label="Train the low-rank update"><rect x="360" y="210" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="387" cy="239" r="13" fill="#fce4cc"/><text x="387" y="244" text-anchor="middle" font-size="12" fill="#a04a18">4</text><text x="410" y="244" font-size="16" fill="#132d42">Train the low-rank update</text><title>The matrices A and B learn an update ΔW = (α/r)BA under the conventional LoRA scaling. Scaling can vary by implementation. Training changes the adapter parameters while the selected base weights remain frozen.</title></g><g class="node" data-id="adapted" tabindex="0" role="button" aria-label="Combine base and update"><rect x="360" y="370" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="387" cy="399" r="13" fill="#fce4cc"/><text x="387" y="404" text-anchor="middle" font-size="12" fill="#a04a18">5</text><text x="410" y="404" font-size="16" fill="#132d42">Combine base and update</text><title>The adapted transformation uses W + ΔW. When supported by the implementation and numerical representation, the update can be merged for inference. Keeping a clean base makes it easier to reuse different adapters.</title></g><g class="node" data-id="validate" tabindex="0" role="button" aria-label="Evaluate the trade-off"><rect x="360" y="530" width="280" height="100" rx="16" fill="#fff" stroke="#c8d4de"/><circle cx="387" cy="559" r="13" fill="#fce4cc"/><text x="387" y="564" text-anchor="middle" font-size="12" fill="#a04a18">6</text><text x="410" y="564" font-size="16" fill="#132d42">Evaluate the trade-off</text><title>Compare candidates on suitable validation data and task metrics, along with memory and compute costs. Increase rank or change targets only when the observed benefit justifies it.</title></g></svg>